<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARA footwear | Офіційний каталог</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #fcfcfc; color: #333; line-height: 1.6; }
        header { background-color: #1a1a1a; color: #fff; padding: 22px 0; text-align: center; font-size: 26px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        header span { color: #b17b44; }
        .hero { background: linear-gradient(rgba(17, 17, 17, 0.75), rgba(17, 17, 17, 0.8)), url('https://images.unsplash.com/photo-1544211100-2fde60f1b53e?q=80&w=2000&auto=format&fit=crop') center/cover; color: white; text-align: center; padding: 80px 20px; }
        .hero h1 { font-size: 38px; margin-bottom: 15px; text-transform: uppercase; font-weight: 800; }
        .catalog-container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.06); transition: 0.3s; text-decoration: none; display: flex; flex-direction: column; border: 1px solid #f0f0f0; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.12); }
        .card-img-wrapper { width: 100%; aspect-ratio: 4/5; overflow: hidden; background: #f9f9f9; padding: 15px; }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .card-info { padding: 20px; border-top: 1px solid #f9f9f9; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 16px; color: #111; font-weight: 700; margin-bottom: 5px; }
        .card-color { font-size: 13px; color: #888; margin-bottom: 12px; }
        .card-price-container { display: flex; align-items: baseline; gap: 10px; margin-top: auto; margin-bottom: 15px; }
        .card-price { font-size: 22px; color: #d32f2f; font-weight: 800; }
        .card-old-price { font-size: 15px; color: #999; text-decoration: line-through; }
        .card-btn { background: #111; color: #fff; text-align: center; padding: 12px; border-radius: 6px; font-weight: 700; text-transform: uppercase; font-size: 13px; }
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; } }
    </style>
</head>
<body>
    <header>PARA <span>footwear</span></header>
    <div class="hero"><h1>Офіційний каталог</h1></div>
    <div class="catalog-container">
        <div class="grid"></div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const priceCache = {};
            document.querySelectorAll('.card').forEach(card => {
                const folder = card.getAttribute('data-folder');
                const targetUrl = folder + '/index.html';
                const priceContainer = card.querySelector('.card-price-container');
                if (priceCache[folder]) { applyPrice(priceContainer, priceCache[folder].newP, priceCache[folder].oldP); return; }
                fetch(targetUrl).then(res => res.text()).then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const fetchedPriceEl = doc.querySelector('.price-new') || doc.querySelector('.st-new');
                    const fetchedOldPriceEl = doc.querySelector('.price-old') || doc.querySelector('.st-old');
                    if (fetchedPriceEl) {
                        const newP = fetchedPriceEl.textContent;
                        const oldP = fetchedOldPriceEl ? fetchedOldPriceEl.textContent : '';
                        priceCache[folder] = { newP, oldP };
                        applyPrice(priceContainer, newP, oldP);
                    }
                });
            });
            function applyPrice(container, newPrice, oldPrice) {
                container.innerHTML = (oldPrice ? '<span class="card-old-price">'+oldPrice+'</span>' : '') + '<span class="card-price">'+newPrice+'</span>';
            }
        });
    </script>
</body>
</html>
